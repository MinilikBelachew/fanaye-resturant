name: Deploy Restaurant Frontend to VPS

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Commit Hash, Branch, or Tag to deploy'
        required: true
        default: 'main'
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - 'production'
          - 'staging'

jobs:
  build-and-push:
    name: Build & Push Docker Image (Cloud Runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_name: ${{ steps.meta.outputs.image_name }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Resolve Docker Image Name & Dual Tags
        id: meta
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          ENV_NAME="${{ github.event.inputs.environment }}"
          IMAGE_BASE="ghcr.io/${{ github.repository }}"
          IMAGE_BASE_LOWER=$(echo "$IMAGE_BASE" | tr '[:upper:]' '[:lower:]')
          
          IMAGE_TAG="${ENV_NAME}-${COMMIT_SHA}"
          IMAGE_NAME="${IMAGE_BASE_LOWER}:${IMAGE_TAG}"
          TAGS="${IMAGE_NAME},${IMAGE_BASE_LOWER}:${ENV_NAME}"
          
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "Resolved target immutable image: $IMAGE_NAME"
          echo "Resolved dual tags: $TAGS"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/backend/v1
            NEXT_PUBLIC_APP_URL=https://restaurant.learnica.net

  deploy-to-vps:
    name: Deploy Container on Contabo VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_ENV: ${{ secrets.PROD_ENV_FILE }}
          STAGE_ENV: ${{ secrets.STAGE_ENV_FILE }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: PROD_ENV,STAGE_ENV,TARGET_ENV,IMAGE_NAME,GHCR_USER,GHCR_PAT
          command_timeout: 10m
          script: |
            set -e
            echo "Starting deployment on VPS for environment: $TARGET_ENV (Image: $IMAGE_NAME)..."

            # 1. Set environment variables, folder paths, and project names
            if [ "$TARGET_ENV" = "production" ]; then
              ROOT_DIR="/var/www/restaurant"
              SERVICE_DIR="/var/www/restaurant/frontend"
              PROJECT_NAME="restaurant"
              ENV_CONTENT="$PROD_ENV"
            else
              ROOT_DIR="/var/www/restaurant-stage"
              SERVICE_DIR="/var/www/restaurant-stage/frontend"
              PROJECT_NAME="restaurant-stage"
              ENV_CONTENT="$STAGE_ENV"
            fi

            # Ensure proper folder ownership and existence
            mkdir -p "$SERVICE_DIR"
            sudo chown -R $USER:$USER "$ROOT_DIR" 2>/dev/null || true

            cd "$SERVICE_DIR"

            # 2. Write standardized docker-compose.prod.yml with fallback
            cat << 'EOF' > docker-compose.prod.yml
            services:
              frontend:
                image: ${DOCKER_IMAGE:-ghcr.io/minilikbelachew/fanaye-resturant:production}
                container_name: ${CONTAINER_PREFIX:-restaurant}-frontend
                restart: always
                ports:
                  - "${FRONTEND_PORT:-3070}:3000"
                env_file:
                  - .env
                environment:
                  NODE_ENV: production
                  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend/v1}
                  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://restaurant.learnica.net}
                networks:
                  - restaurant-frontend-network

            networks:
              restaurant-frontend-network:
                driver: bridge
            EOF

            # 3. Smart Merge .env from GitHub Secrets if provided
            if [ -n "$ENV_CONTENT" ]; then
              echo "Smart merging $TARGET_ENV frontend .env with GitHub Secrets..."
              ENV_CONTENT="$ENV_CONTENT" node -e '
                const fs = require("fs");
                const path = process.argv[1];
                const incoming = process.env.ENV_CONTENT || "";
                
                let lines = [];
                if (fs.existsSync(path)) {
                  lines = fs.readFileSync(path, "utf8").split(/\r?\n/);
                }
                
                const incomingEntries = incoming.split(/\r?\n/)
                  .map(line => line.trim())
                  .filter(line => line && !line.startsWith("#") && line.includes("="));
                
                const incomingMap = new Map();
                for (const entry of incomingEntries) {
                  const idx = entry.indexOf("=");
                  const key = entry.slice(0, idx).trim();
                  const val = entry.slice(idx + 1);
                  if (key) incomingMap.set(key, val);
                }
                
                const updatedKeys = new Set();
                const newLines = lines.map(line => {
                  const trimmed = line.trim();
                  if (!trimmed || trimmed.startsWith("#") || !trimmed.includes("=")) {
                    return line;
                  }
                  const idx = trimmed.indexOf("=");
                  const key = trimmed.slice(0, idx).trim();
                  if (incomingMap.has(key)) {
                    updatedKeys.add(key);
                    return `${key}=${incomingMap.get(key)}`;
                  }
                  return line;
                });
                
                for (const [key, val] of incomingMap.entries()) {
                  if (!updatedKeys.has(key)) {
                    newLines.push(`${key}=${val}`);
                  }
                }
                
                fs.writeFileSync(path, newLines.join("\n").trim() + "\n", { mode: 0o600 });
                console.log("Successfully merged " + incomingMap.size + " environment variable(s) into " + path);
              ' "$SERVICE_DIR/.env"
            fi

            # Persist running DOCKER_IMAGE in .env for instant visibility & docker compose fallback
            if [ -f "$SERVICE_DIR/.env" ]; then
              sed -i '/^DOCKER_IMAGE=/d' "$SERVICE_DIR/.env" 2>/dev/null || true
              echo "DOCKER_IMAGE=$IMAGE_NAME" >> "$SERVICE_DIR/.env"
            fi

            # 4. Pull pre-built image from GHCR and start container in seconds
            echo "Pulling pre-built image from GHCR: $IMAGE_NAME..."
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin 2>/dev/null || true

            PREFIX="restaurant"
            if [ "$TARGET_ENV" != "production" ]; then
              PREFIX="restaurant-stage"
            fi
            docker rm -f "${PREFIX}-frontend" 2>/dev/null || true

            DOCKER_IMAGE="$IMAGE_NAME" docker compose -p "${PROJECT_NAME}-frontend" -f docker-compose.prod.yml pull frontend
            DOCKER_IMAGE="$IMAGE_NAME" docker compose -p "${PROJECT_NAME}-frontend" -f docker-compose.prod.yml up -d frontend

            # 5. Clean up unused Docker images to save space
            echo "Pruning unused Docker images..."
            docker image prune -f

            echo "Frontend deployment to $TARGET_ENV (image: $IMAGE_NAME) successfully completed in seconds!"
